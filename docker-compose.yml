services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hive}
      POSTGRES_USER: ${POSTGRES_USER:-hive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hive_template_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hive} -d ${POSTGRES_DB:-hive}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default

  backend:
    container_name: hive-template-backend
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hive}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hive}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      FRONTEND_URL: ${FRONTEND_URL:-https://hive.100xseller.com}
      BACKEND_URL: ${BACKEND_URL:-https://hiveapi.100xseller.com}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    volumes:
      - ./resources:/app/resources:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - proxy

  frontend:
    container_name: hive-template-frontend
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-https://hiveapi.100xseller.com/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - default
      - proxy

volumes:
  hive_template_postgres:

networks:
  proxy:
    external: true
