name: Deploy Hive to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hive-vps-deploy
  cancel-in-progress: false

env:
  APP_PATH: /opt/hive-template-importer

jobs:
  deploy:
    runs-on: [self-hosted, linux, hive-vps]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync checkout to app path
        run: |
          mkdir -p "$APP_PATH"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.vps' \
            --exclude '.env' \
            --exclude 'frontend/node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude '__pycache__/' \
            --exclude '.venv/' \
            --filter 'P .env' \
            ./ "$APP_PATH/"

      - name: Rebuild stack and verify
        run: |
          chmod +x "$APP_PATH/scripts/remote-deploy.sh"
          "$APP_PATH/scripts/remote-deploy.sh"

      - name: Public HTTPS smoke tests
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null -w "frontend %{http_code}\n" https://hive.100xseller.com/ \
              && curl -fsS https://hiveapi.100xseller.com/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "Public HTTPS smoke tests failed after retries" >&2
          curl -sS -D - -o /dev/null https://hive.100xseller.com/ || true
          curl -sS https://hiveapi.100xseller.com/health || true
          echo
          exit 1
