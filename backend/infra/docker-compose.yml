services:
  api:
    image: ghcr.io/bharatscales/agarwal-api:latest
    container_name: agarwal-api
    restart: always

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    networks:
      - saas_shared_net
      - agarwal_internal


  db:
    image: postgres:16-alpine
    container_name: agarwal-db
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - agarwal_internal


networks:
  saas_shared_net:
    external: true

  agarwal_internal:
    external: true
